<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>名片款式图库</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { background: #f4f5f7; color: #222; font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
  body { padding-bottom: calc(76px + env(safe-area-inset-bottom)); }

  /* 顶部 */
  .topbar {
    background: linear-gradient(135deg, #ff7a45 0%, #f5222d 100%);
    color: #fff; padding: 18px 16px 20px; text-align: center;
    border-radius: 0 0 20px 20px; box-shadow: 0 4px 14px rgba(245,34,45,.25);
  }
  .topbar h1 { font-size: 22px; letter-spacing: 2px; }
  .topbar p { margin-top: 8px; font-size: 13px; opacity: .92; line-height: 1.6; }
  .topbar b { font-size: 15px; }

  /* 图库 */
  .grid {
    display: grid; grid-template-columns: repeat(2, 1fr);
    gap: 10px;
    padding: 12px;
    max-width: 1400px; margin: 0 auto;
  }
  /* 平板/电脑：每行 3 张 */
  @media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
  .card {
    background: #fff; border-radius: 8px; overflow: hidden;
    box-shadow: 0 1px 4px rgba(0,0,0,.08); position: relative;
  }
  .ph {
    aspect-ratio: 3 / 2; background: #eeeef1;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden;
  }
  .ph img {
    width: 100%; height: 100%; object-fit: contain;
    opacity: 0; transition: opacity .35s;
    /* 关键：允许手机长按弹出“保存图片”菜单 */
    -webkit-touch-callout: default;
  }
  .ph img.loaded { opacity: 1; }
  .no-num {
    position: absolute; left: 4px; top: 4px;
    background: rgba(0,0,0,.55); color: #fff; font-size: 10px;
    padding: 1px 6px; border-radius: 20px; line-height: 1.5;
  }

  /* 底部操作条 */
  .footer-bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    display: flex; gap: 10px; align-items: center;
    padding: 10px 14px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255,255,255,.96); box-shadow: 0 -2px 12px rgba(0,0,0,.08);
  }
  .btn-help {
    width: 100%; border: 1px solid #f5222d; color: #f5222d;
    background: #fff; border-radius: 999px; font-size: 15px;
    padding: 12px 16px;
  }
  .btn-help:active { opacity: .85; }

  /* 入场提示弹窗 */
  .mask {
    position: fixed; inset: 0; z-index: 100;
    background: rgba(0,0,0,.55);
    display: flex; align-items: center; justify-content: center;
    padding: 30px; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .mask.show { opacity: 1; pointer-events: auto; }
  .modal {
    width: 100%; max-width: 360px; background: #fff;
    border-radius: 18px; padding: 26px 22px 22px; text-align: center;
    transform: scale(.9); transition: transform .25s;
  }
  .mask.show .modal { transform: scale(1); }
  .modal .icon { font-size: 46px; }
  .modal h2 { margin: 10px 0 16px; font-size: 20px; color: #f5222d; }
  .steps { list-style: none; text-align: left; margin-bottom: 22px; }
  .steps li {
    position: relative; padding: 9px 0 9px 34px;
    font-size: 14.5px; line-height: 1.65; color: #444;
    border-bottom: 1px dashed #eee;
  }
  .steps li:last-child { border-bottom: none; }
  .steps li .n {
    position: absolute; left: 0; top: 9px;
    width: 23px; height: 23px; border-radius: 50%;
    background: linear-gradient(135deg, #ff7a45, #f5222d); color: #fff;
    font-size: 13px; display: flex; align-items: center; justify-content: center;
  }
  .steps b { color: #f5222d; }
  .btn-know {
    width: 100%; border: none; cursor: pointer;
    background: linear-gradient(135deg, #ff7a45, #f5222d); color: #fff;
    font-size: 17px; font-weight: bold; letter-spacing: 2px;
    border-radius: 999px; padding: 14px 0;
    box-shadow: 0 4px 12px rgba(245,34,45,.35);
  }

  /* 大图查看 */
  .viewer {
    position: fixed; inset: 0; z-index: 90;
    background: rgba(0,0,0,.94);
    display: none; flex-direction: column;
  }
  .viewer.show { display: flex; }
  .viewer-bar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 14px 16px calc(10px + env(safe-area-inset-top)); color: #fff; font-size: 14px;
  }
  .viewer-close {
    width: 34px; height: 34px; border-radius: 50%;
    border: none; background: rgba(255,255,255,.18); color: #fff;
    font-size: 16px;
  }
  .viewer-body { flex: 1; display: flex; align-items: center; justify-content: center; padding: 0 12px; overflow: hidden; }
  .viewer-body img {
    max-width: 100%; max-height: 100%; border-radius: 6px;
    /* 关键：允许手机长按弹出“保存图片”菜单，勿加 user-select:none / touch-callout:none */
    -webkit-touch-callout: default;
  }
  .viewer-nav {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 40px; height: 60px; border: none;
    background: rgba(255,255,255,.14); color: #fff; font-size: 20px;
  }
  .viewer-nav.prev { left: 0; border-radius: 0 8px 8px 0; }
  .viewer-nav.next { right: 0; border-radius: 8px 0 0 8px; }
  .viewer-tip {
    text-align: center; color: #fff; font-size: 14px;
    padding: 14px 0 calc(16px + env(safe-area-inset-bottom));
    letter-spacing: 1px;
  }
</style>
</head>
<body>

<header class="topbar">
  <h1>名片款式图库</h1>
  <p>共 <b id="total">0</b> 款名片样式<br>看到喜欢的款式，<b>长按图片即可保存</b></p>
</header>

<main id="gallery" class="grid"></main>

<div class="footer-bar">
  <button class="btn-help" id="btnHelp">查看保存图片提示</button>
</div>

<!-- 入场提示弹窗 -->
<div class="mask" id="mask">
  <div class="modal">
    <div class="icon">💡</div>
    <h2>温馨提示</h2>
    <ul class="steps">
      <li><span class="n">1</span>浏览下方名片款式，看到喜欢的图片，<b>长按图片</b>选择“保存图片”即可保存到手机</li>
      <li><span class="n">2</span>去客服聊天界面找<b>发货链接</b>，然后<b>上传图片</b>哦</li>
      <li><span class="n">3</span>打开下单后的发货链接里改名片，<b>不在这里改！</b></li>
    </ul>
    <button class="btn-know" id="btnKnow">我知道了，开始挑选</button>
  </div>
</div>

<!-- 大图查看 -->
<div class="viewer" id="viewer">
  <div class="viewer-bar">
    <span id="viewerIndex"></span>
    <button class="viewer-close" id="viewerClose">✕</button>
  </div>
  <div class="viewer-body">
    <button class="viewer-nav prev" id="viewerPrev">‹</button>
    <img id="viewerImg" src="" alt="名片大图">
    <button class="viewer-nav next" id="viewerNext">›</button>
  </div>
  <div class="viewer-tip">📷 长按图片可保存到手机</div>
</div>

<script src="images.js"></script>
<script>
/* ================= 可配置项 ================= */
// 图片所在文件夹（相对于本 html 的路径）
var IMAGE_BASE = './image/';
/* ============================================ */

var IMAGES = window.IMAGE_DATA || [];
var gallery = document.getElementById('gallery');
var mask = document.getElementById('mask');

function imgUrl(name) {
  return encodeURI(IMAGE_BASE + name);
}

document.getElementById('total').textContent = IMAGES.length;

/* 渲染图库（懒加载，1000+ 张也不会一次性加载） */
function renderGallery() {
  var frag = document.createDocumentFragment();
  IMAGES.forEach(function (name, i) {
    var card = document.createElement('div');
    card.className = 'card';

    var badge = document.createElement('span');
    badge.className = 'no-num';
    badge.textContent = '编号 ' + name.replace(/\.[^.]+$/, '');

    var ph = document.createElement('div');
    ph.className = 'ph';
    var img = document.createElement('img');
    img.alt = '名片款式 ' + (i + 1);
    img.dataset.src = imgUrl(name);
    ph.appendChild(img);

    card.appendChild(badge);
    card.appendChild(ph);
    card.addEventListener('click', function () { openViewer(i); });
    frag.appendChild(card);
  });
  gallery.appendChild(frag);

  if ('IntersectionObserver' in window) {
    var io = new IntersectionObserver(function (entries) {
      entries.forEach(function (e) {
        if (e.isIntersecting) {
          var im = e.target.querySelector('img');
          if (im && im.dataset.src) {
            im.src = im.dataset.src;
            im.addEventListener('load', function () { im.classList.add('loaded'); });
            im.addEventListener('error', function () { im.classList.add('loaded'); });
            delete im.dataset.src;
          }
          io.unobserve(e.target);
        }
      });
    }, { rootMargin: '400px 0px' });
    Array.prototype.forEach.call(gallery.children, function (c) { io.observe(c); });
  } else {
    Array.prototype.forEach.call(gallery.querySelectorAll('img'), function (im) {
      im.src = im.dataset.src;
      im.classList.add('loaded');
    });
  }
}

/* 入场弹窗：每次打开页面显示一次（同一次浏览期间刷新不再重复弹） */
function showTip() { mask.classList.add('show'); }
function hideTip() { mask.classList.remove('show'); }
document.getElementById('btnKnow').addEventListener('click', hideTip);
document.getElementById('btnHelp').addEventListener('click', showTip);
mask.addEventListener('click', function (e) { if (e.target === mask) hideTip(); });
showTip();

/* 大图查看 */
var viewer = document.getElementById('viewer');
var viewerImg = document.getElementById('viewerImg');
var viewerIndex = document.getElementById('viewerIndex');
var cur = 0;

function openViewer(i) {
  cur = i;
  viewerImg.src = imgUrl(IMAGES[i]);
  viewerIndex.textContent = '第 ' + (i + 1) + ' / ' + IMAGES.length + ' 款';
  viewer.classList.add('show');
}
function closeViewer() {
  viewer.classList.remove('show');
  viewerImg.src = '';
}
document.getElementById('viewerClose').addEventListener('click', closeViewer);
/* 点击背景/非图片区域关闭查看器 */
viewer.addEventListener('click', function (e) {
  if (e.target === viewerImg) return;
  closeViewer();
});
document.getElementById('viewerPrev').addEventListener('click', function (e) {
  e.stopPropagation();
  openViewer((cur - 1 + IMAGES.length) % IMAGES.length);
});
document.getElementById('viewerNext').addEventListener('click', function (e) {
  e.stopPropagation();
  openViewer((cur + 1) % IMAGES.length);
});
/* 手机左右滑动切换 */
var touchX = null;
viewerImg.addEventListener('touchstart', function (e) { touchX = e.touches[0].clientX; }, { passive: true });
viewerImg.addEventListener('touchend', function (e) {
  if (touchX === null) return;
  var dx = e.changedTouches[0].clientX - touchX;
  if (Math.abs(dx) > 50) {
    openViewer((cur + (dx < 0 ? 1 : -1) + IMAGES.length) % IMAGES.length);
  }
  touchX = null;
}, { passive: true });

renderGallery();
</script>
</body>
</html>
